name: build-v3

on:
  push:
    branches:
    tags:
    paths:
      - ".github/workflows/ci-v3.yml"
      - "v3/**"
  pull_request:
    paths:
      - ".github/workflows/ci-v3.yml"
      - "v3/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # v3/go.mod builds the !go1.25 expiry tests, stable their testing/synctest version
        go: ["go.mod", "stable"]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: read go version from v3/go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' v3/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || steps.gomod.outputs.version }}
          check-latest: true
          cache-dependency-path: v3/go.sum
        id: go

      - name: build and test
        run: |
          go test -timeout=60s -race -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov
          go build -race
        working-directory: v3

      - name: golangci-lint
        # golangci-lint v2.6 cannot read export data from newer Go releases
        if: matrix.go == 'go.mod'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6
          args: --config ../.golangci.yml
          working-directory: v3

      - name: install goveralls, submit coverage
        if: matrix.go == 'stable'
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: v3
