name: build-v2

on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"
  pull_request:
    paths:
      - ".github/workflows/ci-v2.yml"
      - "v2/**"

permissions:
  contents: read  # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: read go version from v2/go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' v2/go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
          cache-dependency-path: v2/go.sum
        id: go

      - name: build and test
        run: |
          go test -timeout=60s -race -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/profile.cov"
          go build -race
        working-directory: v2

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --config ../.golangci.yml
          working-directory: v2

      - name: install goveralls, submit coverage
        run: |
          go install github.com/mattn/goveralls@v0.0.12
          goveralls -service="github" -coverprofile="$GITHUB_WORKSPACE/profile.cov"
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: v2
