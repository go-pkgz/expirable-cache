name: build

on:
  push:
    branches:
    tags:
    paths-ignore:
      - ".github/workflows/ci-v2.yml"
      - ".github/workflows/ci-v3.yml"
      - "v2/**"
      - "v3/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/ci-v2.yml"
      - ".github/workflows/ci-v3.yml"
      - "v2/**"
      - "v3/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: read go version from go.mod
        id: gomod
        run: |
          version=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]; exit}' go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gomod.outputs.version }}
          check-latest: true
        id: go

      - name: build and test
        run: |
          go test -timeout=60s -race -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov
          go build -race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6

      - name: install goveralls, submit coverage
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
